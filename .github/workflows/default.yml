name: default

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate YAML files
        run: |
          python3 -c "
          import glob, sys, yaml
          files = glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True)
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f'ok: {f}')
          "

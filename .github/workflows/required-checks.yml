name: required checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  required-checks:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Semgrep (only findings this pull request adds)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          semgrep scan --config p/trailofbits --config p/default --severity ERROR --error --metrics off \
            --baseline-commit "${{ github.event.pull_request.base.sha }}"
      - name: No secrets interpolated directly into run steps
        run: |
          apk add --no-cache py3-yaml
          python3 .github/scripts/check_run_secrets.py
